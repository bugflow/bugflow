# The requirements of the model in docs/architecture.md, in order.
# A test that holds one is marked with pytest.mark.model, giving its
# group and its requirement as written here; one that no test here
# holds says what holds it. The model section of docs/architecture.md
# is written from this file: see
# src/bugflow/shared/tests/model_section.py.

# The things the model names, each of which has a line in docs/words.md.
things = [
    "gnome", "manifest", "doctrine", "clause", "policy", "subject",
    "case", "skill", "binding", "profile", "setting", "pace layer",
    "deployment", "server", "reviewer", "judge", "model class", "check",
    "finding", "grade", "ceiling", "verdict", "calibration", "glossary",
]

