<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend by __BY__</title>
<link rel="stylesheet" href="pages.css">
</head>
<body>
<main>
  <nav><a href="./">Overview</a><a href="layers">Layers</a><a
    href="agents">Agents</a><a href="allowances">Allowances</a></nav>
  <h1>Spend by __BY__</h1>
  <div id="signedout" hidden>
    <p class="lede">Sign in to see what each __BY__ spent.</p>
    <button id="signin">Sign in</button>
  </div>
  <div id="message" role="alert"></div>
  <div id="signedin" hidden>
    <form class="period" id="period">
      <label>From <input type="date" id="since" required></label>
      <label>Through <input type="date" id="until" required></label>
      <button type="submit">Read the period</button>
    </form>
    <p class="lede" id="spendlede"></p>
    <div class="wrap"><table id="spend"></table></div>
    <h2>Allowances</h2>
    <p class="lede">Each allowance whose scope names a __BY__, beside what
      its scope spent in its current period. An allowance per run is
      measured on each run's own page.</p>
    <div class="wrap"><table id="allowances"></table></div>
  </div>
</main>
<script src="../sign-in.js"></script>
<script src="pages.js"></script>
<script>
"use strict";

const BY = "__BY__", KEY = BY === "layer" ? "layer" : "agent_id";

function renderSpend(held) {
  document.getElementById("spendlede").textContent =
    "What each " + BY + " spent on every repository from " +
    when(held.since) + " to " + when(held.until) + ", most first. Each " +
    "figure opens the " + BY + "'s spend by repository and its runs.";
  const table = document.getElementById("spend");
  table.replaceChildren();
  if (!held.cells.length) {
    empty(table, "Nothing was spent in the period.");
    return;
  }
  const totals = new Map();
  held.cells.forEach(one => {
    const name = one[KEY];
    const total = totals.get(name) ||
      { usd: 0, facts: 0, repositories: new Set() };
    total.usd += one.usd;
    total.facts += one.facts;
    total.repositories.add(one.forge + ":" + one.repo);
    totals.set(name, total);
  });
  heading(table, [[BY === "layer" ? "Layer" : "Agent"], ["Spent", "num"],
                  ["Facts", "num"], ["Repositories", "num"]]);
  [...totals.entries()].sort((a, b) => b[1].usd - a[1].usd)
    .forEach(([name, total]) => {
      const period = periodQuery(new URLSearchParams(location.search));
      period.set(BY, name);
      cells(table.insertRow(), [
        named(name),
        [link(dollars(total.usd), BY + "?" + period), "num"],
        [String(total.facts), "num"],
        [String(total.repositories.size), "num"]]);
    });
  cells(table.insertRow(), [
    ["Total"], [dollars(held.spent_usd), "num"],
    [String(held.cells.reduce((sum, one) => sum + one.facts, 0)), "num"],
    [""]]);
}

const params = new URLSearchParams(location.search);
openPage("api/operations/__EVERY__?" + periodQuery(params), held => {
  renderSpend(held);
  renderAllowances(document.getElementById("allowances"), held.allowances,
                   "No allowance names a " + BY + ".");
  choosePeriod(held);
});
</script>
</body>
</html>
