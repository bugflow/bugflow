[project]
name = "bugflow"
version = "0.0.0"
description = "Self-hosted infrastructure for teams that want to converge on methodology for using AI to augment human creativity"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.14",
    "boto3>=1.43.97",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    # Checking a runner's answer against the JSON schema its task gave.
    "jsonschema>=4.26.0",
    # Trace spans for calls to a model. Only the API: with no SDK set
    # up by the application, the spans are not recorded.
    "opentelemetry-api>=1.30",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.10",
    # The sealing libraries' own keeper, which verifies what a client
    # seals into an archive kept here, so the rules a seal is held to
    # are written once. Pinned to a commit until the library cuts a
    # release.
    "pyposlib",
    "sqlalchemy>=2.0.52",
    "temporalio>=1.32.0",
    "uvicorn>=0.52.4",
]

[tool.uv.sources]
pyposlib = { git = "https://github.com/ClankaOperatingSystem/pyposlib.git", rev = "6b00d568036cd9fdec6ee0c2066790aedd23ed47" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-boto3>=1.43.97",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugflow"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# pyposlib ships no type information; what crosses from it is given a
# type by the adapter that calls it.
[[tool.mypy.overrides]]
module = "pyposlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["src"]

# The rules of docs/ADRs/001-code-layout.md, held by lint-imports.
[tool.importlinter]
root_package = "bugflow"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Inside shared, imports point inward"
type = "layers"
containers = ["bugflow.shared"]
layers = ["infrastructure", "domain"]

[[tool.importlinter.contracts]]
name = "Inside a context, imports point inward"
type = "layers"
containers = ["bugflow.archive", "bugflow.forge", "bugflow.work"]
layers = ["(infrastructure) | (usecases)", "(dtos)", "domain"]

[[tool.importlinter.contracts]]
name = "Shared imports no context"
type = "forbidden"
source_modules = ["bugflow.shared"]
forbidden_modules = ["bugflow.archive", "bugflow.forge", "bugflow.work"]

[[tool.importlinter.contracts]]
name = "A use case does not import what runs it"
type = "forbidden"
source_modules = ["bugflow.archive.usecases", "bugflow.forge.usecases", "bugflow.work.usecases"]
forbidden_modules = ["fastapi", "starlette", "temporalio", "sqlalchemy", "psycopg", "boto3"]

[[tool.importlinter.contracts]]
name = "Nothing imports an application"
type = "forbidden"
source_modules = ["bugflow.shared", "bugflow.archive", "bugflow.forge", "bugflow.work"]
forbidden_modules = ["bugflow.apps"]

[[tool.importlinter.contracts]]
name = "A context imports no other context"
type = "independence"
modules = ["bugflow.archive", "bugflow.forge", "bugflow.work"]
