[project]
name = "bugflow"
version = "0.0.0"
description = "Self-hosted infrastructure for teams that want to converge on methodology for using AI to augment human creativity"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugflow"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
