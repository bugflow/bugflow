[project]
name = "bugflow"
version = "0.0.0"
description = "Self-hosted infrastructure for teams that want to converge on methodology for using AI to augment human creativity"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
dependencies = [
    "boto3>=1.43.97",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-boto3>=1.43.97",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bugflow"]

[tool.ruff]
line-length = 79
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["src"]

# The rules of docs/ADRs/001-code-layout.md, held by lint-imports.
[tool.importlinter]
root_package = "bugflow"

[[tool.importlinter.contracts]]
name = "Inside shared, imports point inward"
type = "layers"
containers = ["bugflow.shared"]
layers = ["infrastructure", "domain"]
